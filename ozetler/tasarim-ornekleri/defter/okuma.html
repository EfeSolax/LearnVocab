<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="defter.css">
<style>
.geri { display: inline-block; margin-top: 26px; font: 700 22px var(--el); color: var(--murekkep); text-decoration: none; }
.metin-ust { margin-top: 10px; }
.metin-ust .konu { font: 700 24px var(--el); color: var(--murekkep); }
.metin-ust h1 { font: 900 40px/1.05 var(--serif); letter-spacing: -.03em; margin: 2px 0 10px; }
.metin-ust .bilgi { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 15px; color: var(--soluk); }
.boyut { display: inline-flex; border: 1.5px solid var(--murekkep); border-radius: 999px; overflow: hidden; margin-left: auto; }
.boyut button { padding: 4px 12px; font-weight: 700; color: var(--murekkep); }
.boyut button + button { border-left: 1.5px solid var(--murekkep); }
@media (min-width: 700px) { .metin-ust h1 { font-size: 56px; } }

/* Okuma kâğıdı: kareli defterin üstüne yapıştırılmış beyaz sayfa */
.kagit { background: var(--kagit-beyaz); box-shadow: var(--golge); margin-top: 26px; padding: 26px 22px 30px; position: relative; }
.kagit::before { content: ""; position: absolute; top: -12px; left: 30px; width: 80px; height: 24px; background: var(--bant); transform: rotate(-4deg); border: 1px solid rgba(0,0,0,.05); }
.kagit p { font: 400 var(--okuma, 20px)/1.75 var(--metin); margin: 0 0 1.1em; }
.k { cursor: pointer; border-radius: 3px; padding: 0 1px; }
.k:hover { background: var(--murekkep-acik); }
.k.listede { text-decoration: underline; text-decoration-color: var(--murekkep); text-decoration-style: dotted; text-decoration-thickness: 2px; text-underline-offset: 5px; }
.k.secili { background: var(--kalem); }
.kenar { font: 600 21px/1.15 var(--el); color: var(--murekkep); margin-top: 10px; transform: rotate(-1.5deg); }

/* Dokununca alttan çıkan yapışkan not */
.not-kutu { position: fixed; left: 50%; bottom: 88px; width: min(440px, calc(100% - 32px)); z-index: 25; transform: translate(-50%, 140%) rotate(-1deg); transition: transform .3s cubic-bezier(.3,.7,.2,1); }
.not-kutu.acik { transform: translate(-50%, 0) rotate(-1deg); }
@media (min-width: 900px) { .not-kutu { bottom: 28px; } }
.not-kutu .yapiskan { transform: none; padding: 22px 20px 18px; }
.not-kutu .ust { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 0; }
.not-kutu .soz { font: 900 32px/1 var(--serif); letter-spacing: -.02em; }
.not-kutu .kok { font: 600 20px var(--el); color: var(--soluk); }
.not-kutu .anlam { font-weight: 700; font-size: 21px; color: var(--murekkep); margin: 8px 0 14px; }
.not-kutu .eylem { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.not-kutu .kapat { position: absolute; top: 8px; right: 12px; font-size: 22px; color: var(--soluk); }
.not-kutu .dugme { min-height: 44px; padding: 0 16px; font-size: 16px; }

.bitti { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; }
</style>
</head>
<body>
<div class="sayfa">
<header class="ust">
  <a class="logo" href="index.html"><span>learnvocab</span></a>
  <nav></nav>
  <div class="sag"><div class="avatar">E</div></div>
</header>

<a class="geri" href="index.html">← okumalar</a>
<div class="metin-ust">
  <div class="konu">psikoloji</div>
  <h1 lang="en">Why Do We Forget Names?</h1>
  <div class="bilgi"><span class="seviye">B1</span><span>246 kelime · ~2 dk</span><span id="sayac">listende 2 kelime var</span>
    <span class="boyut"><button id="kucult" aria-label="Yazıyı küçült">A−</button><button id="buyut" aria-label="Yazıyı büyüt">A+</button></span></div>
</div>

<article class="kagit" id="kagit" lang="en"></article>
<div class="kenar">noktalı çizgililer zaten listende. herhangi bir kelimeye dokun →</div>

<div class="bitti">
  <a class="dugme" href="learnpass.html">Okudum, bu metnin kelimelerini çalış</a>
  <a class="el-bag" href="#">sıradaki metin →</a>
</div>
<div class="sayfa-no">— s. 1 / 2 —</div>
</div>

<div class="not-kutu" id="notKutu" aria-live="polite">
  <div class="yapiskan bantli">
    <button class="kapat" id="kapat" aria-label="Kapat">✕</button>
    <div class="ust"><span class="soz" id="nSoz" lang="en"></span><span class="seviye" id="nSeviye"></span></div>
    <div class="kok" id="nKok"></div>
    <div class="anlam" id="nAnlam"></div>
    <div class="eylem"><button class="dugme" id="nEkle">+ Listeme ekle</button><a class="el-bag" href="kelime.html" style="font-size:21px">sözlükte aç</a></div>
  </div>
</div>

<script src="defter.js"></script>
<script>
var paragraflar = ["Most people have had this experience: you meet someone at a party, they tell you their name, and ten seconds later it has completely disappeared from your mind. You remember their face, their job and even the colour of their shirt, but the name is gone.", "Psychologists have a simple explanation. When we are introduced to someone, our attention is divided. We are thinking about what to say next, how we look and whether we are making a good impression. The name arrives at exactly the moment when our mind is busy with other things, so it never really enters our memory.", "Names are also difficult because they carry very little meaning. If someone tells you they are a baker, your brain connects the word to smells, bread and early mornings. A name like 'Daniel' or 'Selin', on the other hand, gives the brain nothing to hold on to."];
var sozluk = {"also": ["also", "A1", "ayrıca"], "arrives": ["arrive", "A1", "varmak"], "attention": ["attention", "A2", "dikkat, odaklanma"], "baker": ["baker", "A2", "fırıncı"], "brain": ["brain", "A2", "beyin"], "bread": ["bread", "A1", "ekmek"], "busy": ["busy", "A1", "meşgul, bir işi/planı olan"], "but": ["but", "A1", "ama"], "carry": ["carry", "A1", "taşımak, götürmek"], "completely": ["completely", "A2", "tamamen"], "connects": ["connect", "A2", "bağlamak, birleştirmek"], "difficult": ["difficult", "A1", "zor, güç"], "disappeared": ["disappear", "A2", "kaybolmak, ortadan kaybolmak"], "divided": ["divide", "B1", "bölmek, ayırmak"], "early": ["early", "A1", "erken"], "enters": ["enter", "A2", "girmek, içeriye geçmek"], "exactly": ["exactly", "A2", "tam olarak"], "experience": ["experience", "A2", "deneyim, tecrübe"], "explanation": ["explanation", "A2", "açıklama, izah"], "face": ["face", "A1", "yüz"], "gives": ["give", "A1", "vermek, birine bir şey sunmak"], "good": ["good", "A1", "iyi, kaliteli"], "hand": ["hand", "A1", "el"], "have": ["have", "A1", "sahip olmak, -si olmak"], "how": ["how", "A1", "nasıl"], "impression": ["impression", "B1", "izlenim, etki"], "introduced": ["introduce", "A1", "tanıştırmak"], "job": ["job", "A1", "iş, meslek, pozisyon"], "little": ["little", "A1", "küçük, ufak"], "meaning": ["meaning", "A1", "anlam, tanım"], "memory": ["memory", "A2", "hafıza, bellek, anı"], "mind": ["mind", "A2", "zihin, akıl"], "moment": ["moment", "A1", "kısa bir zaman dilimi, an"], "mornings": ["morning", "A1", "sabah"], "most": ["most", "A1", "çoğu, en çok"], "name": ["name", "A1", "isim, ad"], "names": ["name", "A1", "isim, ad"], "never": ["never", "A1", "asla"], "next": ["next", "A1", "takip eden, bir sonraki"], "other": ["other", "A1", "diğer, başka"], "party": ["party", "A1", "kutlama, eğlence, davetli toplantı"], "people": ["people", "A1", "insanlar, halk"], "psychologists": ["psychologist", "B2", "psikolog"], "really": ["really", "A1", "gerçekten"], "remember": ["remember", "A1", "hatırlamak, akılda tutmak"], "shirt": ["shirt", "A1", "gömlek"], "simple": ["simple", "A2", "kolay, anlaşılması basit"], "smells": ["smell", "A2", "koku"], "someone": ["someone", "A2", "birisi"], "tell": ["tell", "A1", "söylemek, bildirmek"], "tells": ["tell", "A1", "söylemek, bildirmek"], "things": ["thing", "A1", "nesne, şey"], "thinking": ["thinking", "A2", "düşünme, düşünce süreci"], "very": ["very", "A1", "çok"], "when": ["when", "A1", "ne zaman"], "whether": ["whether", "B1", "-ip -mediğini, olup olmadığını"], "word": ["word", "A1", "sözcük, kelime"]};
var listede = { attention: 1, impression: 1 };
var kagit = document.getElementById('kagit');
paragraflar.forEach(function (p) {
  var el = document.createElement('p');
  el.innerHTML = p.replace(/[A-Za-z']+/g, function (w) {
    var k = w.toLowerCase().replace(/^'|'$/g, '');
    var kok = sozluk[k] ? sozluk[k][0] : k;
    return '<span class="k' + (listede[kok] ? ' listede' : '') + '" data-k="' + k + '">' + w + '</span>';
  });
  kagit.appendChild(el);
});
var not = document.getElementById('notKutu'), secili = null;
kagit.addEventListener('click', function (e) {
  var s = e.target.closest('.k'); if (!s) return;
  if (secili) secili.classList.remove('secili');
  secili = s; s.classList.add('secili');
  var v = sozluk[s.dataset.k];
  document.getElementById('nSoz').textContent = s.textContent;
  document.getElementById('nKok').textContent = v && v[0] !== s.dataset.k ? 'kökü: ' + v[0] : '';
  document.getElementById('nSeviye').textContent = v ? v[1] : '';
  document.getElementById('nSeviye').style.display = v ? '' : 'none';
  document.getElementById('nAnlam').textContent = v ? v[2] : 'Bu örnek sayfada yalnızca bazı kelimelerin anlamı var.';
  var ekle = document.getElementById('nEkle');
  var kok = v ? v[0] : s.dataset.k;
  ekle.textContent = listede[kok] ? '✓ Listende' : '+ Listeme ekle';
  ekle.classList.toggle('ikincil', !!listede[kok]);
  ekle.onclick = function () {
    listede[kok] = 1; ekle.textContent = '✓ Listende'; ekle.classList.add('ikincil');
    document.querySelectorAll('.k').forEach(function (x) { var y = sozluk[x.dataset.k]; if ((y ? y[0] : x.dataset.k) === kok) x.classList.add('listede'); });
    document.getElementById('sayac').textContent = 'listende ' + Object.keys(listede).length + ' kelime var';
  };
  not.classList.add('acik');
});
document.getElementById('kapat').onclick = function () { not.classList.remove('acik'); if (secili) secili.classList.remove('secili'); };
var boyut = 20;
function yaz() { document.documentElement.style.setProperty('--okuma', boyut + 'px'); }
document.getElementById('buyut').onclick = function () { boyut = Math.min(26, boyut + 2); yaz(); };
document.getElementById('kucult').onclick = function () { boyut = Math.max(16, boyut - 2); yaz(); };
</script>
</body>
</html>
