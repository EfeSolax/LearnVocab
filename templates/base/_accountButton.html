{% comment %}
Sağ üst köşe. Giriş yapılmışsa küçük profil fotoğrafı (profil sayfasına
götürür), yapılmamışsa "Giriş Yap". Masaüstünde ve mobilde aynı davranış.
{% endcomment %}
{% if user.is_authenticated %}
<a href="{% url 'user_profile' %}" title="Profilim" aria-label="Profilim"
   class="block shrink-0 rounded-full ring-2 ring-indigo-400 dark:ring-indigo-600 hover:ring-indigo-600 dark:hover:ring-indigo-400 transition">
    {% if user.profile_pic %}
        <img src="{{ user.profile_pic.url }}" alt="{{ user.username }}"
             class="h-9 w-9 rounded-full object-cover">
    {% else %}
        <span class="flex h-9 w-9 items-center justify-center overflow-hidden rounded-full bg-gray-100 dark:bg-slate-700">
            <svg class="h-full w-full text-gray-300 dark:text-slate-500" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M24 20.993V24H0v-2.996A14.977 14.977 0 0112.004 15c4.904 0 9.26 2.354 11.996 5.993zM16.002 8.999a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
        </span>
    {% endif %}
</a>
{% else %}
<a href="{% url 'login' %}"
   class="shrink-0 inline-flex items-center rounded-lg bg-indigo-600 px-3.5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-700 transition-colors">
    Giriş Yap
</a>
{% endif %}
