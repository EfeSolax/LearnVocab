{% comment %}
Açık / karanlık tema düğmesi.

İkonlar CSS ile değişiyor (dark:hidden / hidden dark:block); JS yalnızca
html etiketindeki "dark" sınıfını açıp kapatıyor ve tercihi kaydediyor.
{% endcomment %}
<button type="button" data-theme-toggle
        class="inline-flex items-center justify-center rounded-md p-2 text-gray-600 dark:text-slate-400 hover:bg-gray-100 hover:text-gray-900 dark:hover:text-slate-100 dark:text-slate-300 dark:hover:bg-slate-700 dark:hover:text-white transition-colors"
        aria-label="Temayı değiştir" title="Açık / karanlık tema">
    {# Açık temadayken ay ikonu (karanlığa geçmek için) #}
    <svg class="h-5 w-5 dark:hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path d="M7.455 2.004a.75.75 0 01.26.77 7 7 0 009.958 7.967.75.75 0 011.067.853A8.5 8.5 0 116.647 1.921a.75.75 0 01.808.083z"/>
    </svg>
    {# Karanlık temadayken güneş ikonu (açığa dönmek için) #}
    <svg class="h-5 w-5 hidden dark:block" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path d="M10 2a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0v-1.5A.75.75 0 0110 2zM10 15a5 5 0 100-10 5 5 0 000 10zM10 15.75a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0v-1.5a.75.75 0 01.75-.75zM18 10a.75.75 0 01-.75.75h-1.5a.75.75 0 010-1.5h1.5A.75.75 0 0118 10zM4.25 10a.75.75 0 01-.75.75H2a.75.75 0 010-1.5h1.5a.75.75 0 01.75.75zM15.657 15.657a.75.75 0 01-1.06 0l-1.061-1.06a.75.75 0 111.06-1.061l1.061 1.06a.75.75 0 010 1.061zM6.464 6.464a.75.75 0 01-1.06 0L4.343 5.404a.75.75 0 011.06-1.06l1.061 1.06a.75.75 0 010 1.06zM4.343 15.657a.75.75 0 010-1.06l1.06-1.061a.75.75 0 111.061 1.06l-1.06 1.061a.75.75 0 01-1.061 0zM13.536 6.464a.75.75 0 010-1.06l1.06-1.061a.75.75 0 111.061 1.06l-1.06 1.061a.75.75 0 01-1.061 0z"/>
    </svg>
    <span class="sr-only">Temayı değiştir</span>
</button>
