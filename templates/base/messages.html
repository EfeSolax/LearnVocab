{% if messages %}
<div class="space-y-4 {% firstof margin_class 'mb-6' %}"> 
    {% for message in messages %}
    <div class="flex items-start justify-between p-4 rounded-lg border {% if message.tags == 'success' %} bg-green-50 dark:bg-green-950 border-green-300 dark:border-green-700 text-green-800 dark:text-green-200 {% elif message.tags == 'error' %} bg-red-50 dark:bg-red-950 border-red-300 dark:border-red-700 text-red-800 dark:text-red-200 {% elif message.tags == 'warning' %} bg-yellow-50 dark:bg-yellow-950 border-yellow-300 dark:border-yellow-700 text-yellow-800 dark:text-yellow-200 {% elif message.tags == 'info' %} bg-blue-50 dark:bg-blue-950 border-blue-300 dark:border-blue-700 text-blue-800 dark:text-blue-200 {% else %} bg-gray-50 dark:bg-slate-900 border-gray-300 dark:border-slate-600 text-gray-800 dark:text-slate-200 {% endif %}"
         role="alert">
        
        <div class="flex-shrink-0">
            {% if message.tags == 'success' %}
            <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>
            {% elif message.tags == 'error' %}
            <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m9.75 9.75 4.5 4.5m0-4.5-4.5 4.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>
            {% elif message.tags == 'warning' %}
            <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" /></svg>
            {% else %} 
            <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" /></svg>
            {% endif %}
        </div>

        <p class="font-medium ml-3 flex-1">{{ message }}</p>

        <button type="button" 
                onclick="this.parentElement.remove()"
                class="ml-4 -mr-1 -my-1 p-1.5 rounded-md opacity-80 hover:opacity-100 focus:outline-none focus:ring-2 {% if message.tags == 'success' %} hover:bg-green-100 dark:hover:bg-green-900 focus:ring-green-400 dark:focus:ring-green-700 {% elif message.tags == 'error' %} hover:bg-red-100 dark:hover:bg-red-900 focus:ring-red-400 dark:focus:ring-red-700 {% elif message.tags == 'warning' %} hover:bg-yellow-100 dark:hover:bg-yellow-900 focus:ring-yellow-400 dark:focus:ring-yellow-700 {% elif message.tags == 'info' %} hover:bg-blue-100 dark:hover:bg-blue-900 focus:ring-blue-400 dark:focus:ring-blue-700 {% else %} hover:bg-gray-100 dark:hover:bg-slate-700 focus:ring-gray-400 dark:focus:ring-slate-500 {% endif %}">
            <span class="sr-only">Kapat</span>
            <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}
