<!-- Temel olarak layout.html'i extend ediyoruz. -->
{% extends 'base/layout.html' %}  

{% block title %}Giriş Yap{% endblock %}

{% block messages %}{% endblock %}


{% block content %}

<div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-sm">
    <h2 class="mt-10 text-center text-2xl/9 font-bold tracking-tight text-gray-900 dark:text-slate-100">Kullanıcı Adınız</h2>
  </div>

  <div class="mt-4 sm:mx-auto sm:w-full sm:max-w-sm bg-white dark:bg-slate-800 p-8 rounded-lg shadow-md">

    {% include 'base/messages.html' with margin_class="" %}

    <form action="{% url 'send_verification_code' %}" method="POST">
      {% csrf_token %}
      <div>
        <p class = "text-gray-400 mb-2">Lütfen kullanıcı adınızı giriniz.</p>
        <label for="username" class="block text-sm/6 font-medium text-gray-900 dark:text-slate-100">Kullanıcı Adı</label>
        <div class="mt-2">
          <input id="username" type="text" name="username" required autocomplete="off" placeholder="Kullanıcı Adı"
          class="block w-full rounded-md bg-white dark:bg-slate-800 border border-gray-300 dark:border-slate-600 px-3 py-1.5 text-base text-gray-900 dark:text-slate-100 outline-1 -outline-offset-1 outline-gray-300 dark:outline-slate-600 placeholder:text-gray-400 dark:placeholder:text-slate-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6" />
        </div>
      </div>
      <div>
        <button type="submit" class="lv-dugme lv-kucuk mt-6 flex w-full">Mail Gönder</button>
      </div>
    </form>

  </div>
</div>



{% endblock %}
