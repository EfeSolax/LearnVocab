{% comment %}
Aile satırındaki kök kelimenin düğmesi. Kökün birden çok türü olabilir
(alarm isim + fiil); ekleme ve çıkarma hepsine birlikte uygulanır.
Bağlam: aile_id, kayitli, geri_qs
{% endcomment %}
<form method="POST" action="{% url 'add_family_to_my_list' aile_id %}" data-kok-form>
    {% csrf_token %}
    <input type="hidden" name="kapsam" value="kok">
    <input type="hidden" name="islem" value="{% if kayitli %}cikar{% else %}ekle{% endif %}">
    <input type="hidden" name="geri" value="{{ geri_qs }}">
    {% if kayitli %}
    <button type="submit" title="Listemden çıkar" aria-label="Listemden çıkar"
            class="inline-flex h-9 w-9 items-center justify-center rounded-lg bg-emerald-50 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400 hover:bg-emerald-100 dark:hover:bg-emerald-900 transition-colors">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.3"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
    </button>
    {% else %}
    <button type="submit" title="Listeme ekle" aria-label="Listeme ekle"
            class="inline-flex h-9 w-9 items-center justify-center rounded-lg bg-white dark:bg-slate-800 text-gray-500 dark:text-slate-400 ring-1 ring-inset ring-gray-300 dark:ring-slate-600 hover:bg-indigo-50 hover:text-indigo-600 dark:hover:bg-indigo-950 dark:hover:text-indigo-400 transition-colors">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
    </button>
    {% endif %}
</form>
