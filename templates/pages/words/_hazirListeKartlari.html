{% load i18n %}
{% comment %}Hazır liste sayfasının kartları (kapalı) + "Daha fazla göster" (?parca=1).{% endcomment %}
{% for kart in kartlar %}
    {% include 'base/_kelimeKarti.html' with kart=kart kapali=True %}
{% endfor %}
{% if sayfa.has_next %}
<button type="button" data-hazir-liste-devam
        data-adres="?sayfa={{ sayfa.next_page_number }}&amp;parca=1" data-yedek="?sayfa={{ sayfa.next_page_number }}"
        class="block w-full rounded-lg px-4 py-2 text-sm font-semibold text-indigo-600 dark:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-slate-800 disabled:opacity-50">{% translate "Daha fazla göster" %}</button>
{% endif %}
