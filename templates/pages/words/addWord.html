{% extends 'base/appLayout.html' %}

{% block title %}Yeni Kelime{% endblock %}
{% block page_heading %}{% endblock %}

{% block page %}
<div class="mx-auto max-w-3xl">
    <form method="POST" class="overflow-hidden rounded-2xl border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800">
        <header class="border-b border-gray-200 dark:border-slate-700 px-5 py-4 sm:px-6">
            <h1 class="text-lg font-bold text-gray-900 dark:text-slate-100">Yeni Kelime</h1>
            <p class="mt-0.5 text-sm text-gray-500 dark:text-slate-400">Kelime bir aileye girer; türü, anlamı ve örnek cümleleri kendisine aittir.</p>
        </header>

        <div class="px-5 py-5 sm:px-6">
            {% include 'base/_wordForm.html' %}
        </div>

        <footer class="flex justify-end gap-3 border-t border-gray-200 dark:border-slate-700 bg-gray-50 dark:bg-slate-900/50 px-5 py-3.5 sm:px-6">
            <a href="{% url 'profile_words' %}" class="rounded-xl border border-gray-300 dark:border-slate-600 px-4 py-2.5 text-sm font-semibold text-gray-700 dark:text-slate-300 hover:bg-gray-100 dark:hover:bg-slate-700 transition-colors">Vazgeç</a>
            <button type="submit" class="rounded-xl bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700 transition-colors">Kelimeyi Kaydet</button>
        </footer>
    </form>
</div>
{% endblock %}
