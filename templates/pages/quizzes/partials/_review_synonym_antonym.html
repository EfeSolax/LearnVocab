<div class="mb-8 p-4 bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-lg shadow-sm">
    <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-semibold text-gray-800 dark:text-slate-200">
            {{ forloop.counter }}. Eş / Zıt Anlamlı
        </h3>
        <span class="text-sm text-gray-600 dark:text-slate-400">
            Süre: <strong>{{ question.time_taken|floatformat:1 }} sn</strong>
        </span>
    </div>

    <p class="mb-4 text-gray-700 dark:text-slate-300" style="white-space: pre-wrap;">{{ question.question_text }}</p>

    <div class="mt-2 mb-2 space-y-3">
        {% for label, text in question.options_as_list %}
            <div class="p-3 rounded-lg {% if label == question.correct_option %} bg-green-100 dark:bg-green-900 border border-green-400 dark:border-green-700 text-green-800 dark:text-green-200 font-medium {% elif label == question.user_answer %} bg-red-100 dark:bg-red-900 border border-red-400 dark:border-red-700 text-red-800 dark:text-red-200 line-through {% else %} bg-gray-100 dark:bg-slate-700 text-gray-600 dark:text-slate-400 {% endif %}">
                <span class="font-bold">{{ label }}.</span> {{ text }}
            </div>
        {% endfor %}
    </div>
</div>
