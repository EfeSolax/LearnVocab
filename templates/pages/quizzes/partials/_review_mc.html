<div classclass="mb-8 p-4 bg-white border border-gray-200 rounded-lg shadow-sm">
    <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-semibold text-gray-800">
            {{ forloop.counter }}. Çoktan Seçmeli
        </h3>
        <span class="text-sm text-gray-600">
            Süre: <strong>{{ question.time_taken|floatformat:1 }} sn</strong>
        </span>
    </div>
    
    <p class="mb-4 text-gray-700" style="white-space: pre-wrap;">{{ question.question_text }}</p>

    <div class="mt-2 mb-2 space-y-3">
        {% for label, text in question.options_as_list %}
            <div class="p-3 rounded-lg
                {% if label == question.correct_option %}
                    bg-green-100 border border-green-400 text-green-800 font-medium
                {% elif label == question.user_answer %}
                    bg-red-100 border border-red-400 text-red-800 line-through
                {% else %}
                    bg-gray-100 text-gray-600
                {% endif %}
            ">
                <span class="font-bold">{{ label }}.</span> {{ text }}
            </div>
        {% endfor %}
    </div>
</div>
