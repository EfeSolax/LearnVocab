<div classclass="mb-8 p-4 bg-white border border-gray-200 rounded-lg shadow-sm">
    <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-semibold text-gray-800 dark:text-slate-200">
            {{ forloop.counter }}. Yazma Sorusu
        </h3>
        <span class="text-sm text-gray-600 dark:text-slate-400">
            Süre: <strong>{{ question.time_taken|floatformat:1 }} sn</strong>
        </span>
    </div>

    <p class="mt-2 mb-4 text-gray-700 dark:text-slate-300" style="white-space: pre-wrap;">{{ question.question_text }}</p>

    {% if question.is_correct %}
        <div class="mb-2 p-3 rounded-lg bg-green-100 dark:bg-green-900 border border-green-400 dark:border-green-700">
            <span class="text-green-800 dark:text-green-200 font-medium">{{ question.user_answer }}</span>
        </div>
    {% else %}
        <div class="mb-2 p-3 rounded-lg bg-red-100 dark:bg-red-900 border border-red-400 dark:border-red-700">
            <span class="text-red-800 dark:text-red-200 line-through">{{ question.user_answer }}</span>
        </div>
        <div class="mb-2 p-3 mt-2 rounded-lg bg-green-100 dark:bg-green-900 border border-green-400 dark:border-green-700">
            <span class="text-gray-600 dark:text-slate-400 text-sm">Doğru Cevap:</span>
            <span class="text-green-800 dark:text-green-200 font-medium">{{ question.correct_answer }}</span>
        </div>
    {% endif %}
</div>
