{% if allUsers %}

{% for current_user in allUsers %}

{% if user == current_user %}
<a href = "{% url 'user_profile' %}" class="mt-2 flex transform items-center rounded-lg px-3 py-2 text-gray-600 dark:text-slate-400 transition-colors duration-300 hover:bg-gray-100 dark:hover:bg-slate-700 hover:text-gray-700 dark:hover:text-slate-300" href="#">
{% else %}
<a href = "{% url 'show_user_profile' current_user.id %}" class="mt-2 flex transform items-center rounded-lg px-3 py-2 text-gray-600 dark:text-slate-400 transition-colors duration-300 hover:bg-gray-100 dark:hover:bg-slate-700 hover:text-gray-700 dark:hover:text-slate-300" href="#">
{% endif %}
    {% if current_user.profile_pic %}
        <img class="h-8 w-8 rounded-full object-cover" src="{{ current_user.profile_pic.url }}" alt="Profil fotoğrafı">
    {% else %}
        <span class="inline-block h-8 w-8 overflow-hidden rounded-full bg-gray-100 dark:bg-slate-700">
            <svg class="h-full w-full text-gray-300 dark:text-slate-600" fill="currentColor" viewBox="0 0 24 24">
                <path d="M24 20.993V24H0v-2.996A14.977 14.977 0 0112.004 15c4.904 0 9.26 2.354 11.996 5.993zM16.002 8.999a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
        </span>
    {% endif %}
    <span class="mx-3 text-sm font-medium">{{ current_user.username }}</span>
</a>
{% endfor %}

{% else %}
<p>Kullanıcılar şu anda görüntülenemiyor.</p>
{% endif %}
